<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股票分析器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: search bar on top, then a verdict strip (long / short term), the price chart with levels and
   patterns, then the detail sections (patterns, backtests, VWAP, stops). Same tokens as the journal page. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #152030; --muted: #5A6577; --faint: #8C96A6; --line: #DCE1E8;
  --accent: #2F4FA8; --accent-soft: #E5EAF7; --gain: #18794E; --gain-soft: #E2F2EA; --loss: #C2362B; --loss-soft: #F8E4E1;
  --warn: #9A6200; --warn-soft: #F7EDD9; --ma50: #C0661A; --ma200: #8A3FA0;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D131B; --surface: #141C27; --ink: #E4EAF2; --muted: #9AA6B8; --faint: #6D798B; --line: #243041;
  --accent: #6E87E0; --accent-soft: #1C2742; --gain: #2A9D63; --gain-soft: #12291F; --loss: #E0533F; --loss-soft: #301916;
  --warn: #D9A03A; --warn-soft: #2C2312; --ma50: #C9762A; --ma200: #B06CC8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #141C27; --ink: #E4EAF2; --muted: #9AA6B8; --faint: #6D798B; --line: #243041;
  --accent: #6E87E0; --accent-soft: #1C2742; --gain: #2A9D63; --gain-soft: #12291F; --loss: #E0533F; --loss-soft: #301916;
  --warn: #D9A03A; --warn-soft: #2C2312; --ma50: #C9762A; --ma200: #B06CC8; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); } .loss { color: var(--loss); } .warn { color: var(--warn); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
header.top h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  font-weight: 500; white-space: nowrap; display: inline-block; }
.chip.gain { background: var(--gain-soft); color: var(--gain); }
.chip.loss { background: var(--loss-soft); color: var(--loss); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

section { display: grid; gap: 14px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; }
.note { color: var(--muted); font-size: 13px; }
.note p { margin: 0 0 .5em; }

.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type=text], input[type=password] { font: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; }
#sym { flex: 1 1 160px; text-transform: uppercase; font-family: var(--font-num); font-weight: 600; }
#key { flex: 1 1 220px; }
button { font: inherit; font-size: 14px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--bg); cursor: pointer; font-weight: 500; }
button.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
button.pick { padding: 4px 12px; border-radius: 999px; font-family: var(--font-num); font-size: 13px; background: var(--surface);
  color: var(--ink); border-color: var(--line); }
button:disabled { opacity: .5; cursor: wait; }
details.key summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.key .box { margin-top: 10px; display: grid; gap: 8px; }
.msg { font-size: 14px; padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); }
.msg.err { background: var(--loss-soft); color: var(--loss); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 12px 16px; display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }

.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.verdict { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); border-radius: 10px;
  padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.verdict h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict .big { font-family: var(--font-display); font-size: 24px; color: var(--c); }
.verdict ul { margin: 0; padding-left: 18px; font-size: 14px; }
.verdict li { margin-bottom: 2px; }
.verdict li .pt { font-family: var(--font-num); font-size: 12px; color: var(--faint); margin-left: 4px; }
.verdict .act { font-size: 14px; background: var(--bg); border-radius: 8px; padding: 8px 12px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chart-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tabs button:disabled { opacity: .4; cursor: not-allowed; }
.fullbtn { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 13px; font-weight: 600; }
.selnote { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.selnote button { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 12px; }
.chart-panel.full { position: fixed; inset: 0; z-index: 50; border-radius: 0; border: 0; display: flex; flex-direction: column; padding: 12px 16px; }
.chart-panel.full .chart { flex: 1 1 0; min-height: 0; }
body.noscroll { overflow: hidden; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .vw { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.chart .zone { fill: var(--accent-soft); }
.chart .pat.sel { stroke-width: 3; }
.chart .hl { stroke-width: 1.3; stroke-dasharray: 3 3; }
.chart text.lab { font-family: var(--font-body); font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.pcard { cursor: pointer; }
.pcard:hover { border-color: var(--accent); }
.pcard[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.h2btn { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; text-align: left; }
.h2btn .chip { font-family: var(--font-body, inherit); font-size: 13px; }
.h2btn[aria-expanded="true"] .chip { background: var(--accent); color: var(--surface); }
.pguide .card { align-content: start; }
.pguide { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px dashed var(--line); }
.psk { width: 120px; height: 60px; display: block; margin: 6px 0; }
.psk polyline { fill: none; stroke: var(--ink, currentColor); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.psk polyline.g { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 3; }
.pexp summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
.pexp[open] summary { margin-bottom: 6px; }
dl.pg { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13.5px; line-height: 1.55; }
dl.pg dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
dl.pg dd { margin: 0; }
.pcard .hint { color: var(--accent); font-size: 13px; font-weight: 600; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .px { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.chart .m50 { fill: none; stroke: var(--ma50); stroke-width: 1.4; }
.chart .m200 { fill: none; stroke: var(--ma200); stroke-width: 1.4; }
.chart .sup { stroke: var(--gain); stroke-width: 1; stroke-dasharray: 5 4; }
.chart .res { stroke: var(--loss); stroke-width: 1; stroke-dasharray: 5 4; }
.chart .pat { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .cross { stroke: var(--faint); stroke-width: 1; }
.chart .dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px;
  border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); line-height: 1.5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c);
  vertical-align: middle; margin-right: 6px; }
.legend span.dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 5px, transparent 5px 8px); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
th { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 500; background: var(--bg); }
td.r, th.r { text-align: right; }
td.wrap-cell { white-space: normal; min-width: 200px; color: var(--muted); font-size: 13px; }
tbody tr:last-child td { border-bottom: 0; }
.best td { background: var(--accent-soft); }
/* frozen first column: row labels stay visible when the table scrolls sideways */
.table-wrap td:first-child, .table-wrap th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: inset -1px 0 0 var(--line); }
.table-wrap th:first-child { background: var(--bg); }
.table-wrap .best td:first-child { background: linear-gradient(var(--accent-soft), var(--accent-soft)) var(--surface); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 10px;
  padding: 12px 16px; display: grid; gap: 6px; font-size: 14px; }
.card b { font-size: 15px; }
.empty { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; }
footer { color: var(--faint); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; vertical-align: -2px; margin-right: 6px; }
@media (prefers-reduced-motion: no-preference) { .spin { animation: sp 0.8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>股票分析器</h1>
      <div class="sub">輸入美股代號 → 自動計晒趨勢、形態、策略回測、止盈止蝕同建議</div>
    </div>
    <nav class="row"><a href="index.html">← 交易日誌</a><a href="portfolio.html">💼 我的持倉</a><a href="events.html">📅 重要日子</a></nav>
  </header>

  <div class="search">
    <form class="row" id="form" autocomplete="off">
      <input type="text" id="sym" placeholder="股票代號，例如 TSLA" aria-label="股票代號" maxlength="10" spellcheck="false">
      <button type="submit" id="go">分析</button>
    </form>
    <div class="row" id="picks"></div>
    <details class="key" id="keybox">
      <summary id="keysum">設定 Twelve Data API key</summary>
      <div class="box">
        <div class="note">數據嚟自 Twelve Data（免費：每分鐘 8 次、每日 800 次；每分析一隻股用 2 次）。
          key 只會儲存喺你呢部機嘅瀏覽器，唔會上載去網站。冇 key？去 twelvedata.com 免費註冊 → API Keys。</div>
        <div class="row">
          <input type="password" id="key" placeholder="貼上你嘅 API key" aria-label="API key">
          <button type="button" id="savekey">儲存</button>
          <button type="button" class="ghost" id="clearkey">清除</button>
        </div>
      </div>
    </details>
    <div id="status" hidden></div>
  </div>

  <div id="out" hidden></div>

  <footer>
    只供學習參考，唔係投資建議。所有結果都係用過去數據計，將來唔一定一樣；圖表形態係電腦按規則自動搵，未必同人眼睇法一致。
    回測假設收市價成交、每邊成本 0.05%、冇計股息同稅。
  </footer>
</div>

<script src="analyzer_core.js"></script>
<script>
"use strict";
const HOLDINGS = {"TSM": {"qty": 4, "cost": 427.263}, "TSLA": {"qty": 4, "cost": 367.43}, "QQQ": {"qty": 1.5407, "cost": 719.835}, "GOOG": {"qty": 3, "cost": 340.0}, "ORCL": {"qty": 7, "cost": 139.9}, "VOO": {"qty": 0.7921, "cost": 706.401}, "QQQM": {"qty": 1.851, "cost": 302.377}, "NVDA": {"qty": 2, "cost": 212.47}};
const A = window.Analyzer;
const $ = id => document.getElementById(id);
const KEY_STORE = "ta_key", CACHE_PREFIX = "ta_cache:", CACHE_MIN = 10, CACHE_KEEP = 6;

// ---------- small helpers ----------
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const ok = x => typeof x === "number" && isFinite(x);
const f2 = (x, d = 2) => (ok(x) ? x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—");
const pct = (x, d = 1, sign = true) => (ok(x) ? (sign && x > 0 ? "+" : "") + (x * 100).toFixed(d) + "%" : "—");
const cls = x => (ok(x) ? (x > 0 ? "gain" : x < 0 ? "loss" : "") : "");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  keys() { try { return Object.keys(localStorage); } catch (e) { return []; } },
};

// holdings typed on the 我的持倉 page (this browser only) win over the list baked in from my_portfolio.json
function loadHoldings() {
  try {
    const s = JSON.parse(store.get("my_holdings") || "null");
    if (s && Array.isArray(s.list) && s.list.length) {
      const out = {};
      for (const r of s.list) {
        if (!(r.qty > 0 && r.cost > 0)) continue;
        const o = out[r.sym] || (out[r.sym] = { qty: 0, cost: 0 });
        o.cost = (o.cost * o.qty + r.cost * r.qty) / (o.qty + r.qty); o.qty += r.qty;
      }
      return out;
    }
  } catch (e) { /* bad saved list: fall back */ }
  return HOLDINGS || {};
}
const HOLD = loadHoldings();

function status(html, kind) {
  const el = $("status");
  el.hidden = !html;
  el.className = kind ? "msg " + kind : "msg";
  el.innerHTML = html || "";
}

// ---------- API key ----------
function refreshKeyUI() {
  const has = !!store.get(KEY_STORE);
  $("keysum").textContent = has ? "API key 已儲存（撳呢度更改）" : "設定 Twelve Data API key（第一次用要設定）";
  $("keybox").open = !has;
}
$("savekey").onclick = () => {
  const k = $("key").value.trim();
  if (!k) return status("請先貼上 API key。", "err");
  if (!store.set(KEY_STORE, k)) return status("呢個瀏覽器唔俾儲存（可能係私密瀏覽模式），請用普通模式再試。", "err");
  $("key").value = ""; refreshKeyUI(); status("已儲存 ✓ 而家可以輸入股票代號分析。");
};
$("clearkey").onclick = () => { store.del(KEY_STORE); refreshKeyUI(); status("已清除 API key。"); };

// ---------- data ----------
const ERR = {
  401: "API key 唔啱，請喺「設定 API key」重新貼過。",
  429: "免費額度暫時用完（每分鐘 8 次／每日 800 次）。等一分鐘再試。",
  400: "搵唔到呢個股票代號，請檢查下（只支援美股，例如 AAPL、TSLA、QQQ）。",
  404: "搵唔到呢個股票代號，請檢查下（只支援美股，例如 AAPL、TSLA、QQQ）。",
};

async function fetchSeries(sym, interval) {
  const ck = CACHE_PREFIX + sym + ":" + interval;
  try {
    const c = JSON.parse(store.get(ck) || "null");
    if (c && Date.now() - c.at < CACHE_MIN * 60000) return c;
  } catch (e) { /* bad cache: refetch */ }
  const key = store.get(KEY_STORE);
  const url = "https://api.twelvedata.com/time_series?symbol=" + encodeURIComponent(sym) + "&interval=" + interval +
              "&outputsize=5000&apikey=" + encodeURIComponent(key);
  let j;
  try { j = await (await fetch(url)).json(); }
  catch (e) { throw new Error("連唔到數據伺服器，請檢查網絡再試。"); }
  if (j.status === "error" || !j.values) {
    const e = new Error(ERR[j.code] || "數據錯誤：" + (j.message || "未知"));
    e.code = j.code; throw e;
  }
  const bars = j.values.map(v => ({ t: v.datetime, o: +v.open, h: +v.high, l: +v.low, c: +v.close, v: +v.volume || 0 })).reverse();
  const out = { at: Date.now(), meta: j.meta || {}, bars };
  saveCache(ck, out);
  return out;
}

function saveCache(ck, obj) {
  // keep only the last few series so localStorage doesn't fill up
  const mine = store.keys().filter(k => k.startsWith(CACHE_PREFIX))
    .map(k => { try { return [k, JSON.parse(store.get(k)).at]; } catch (e) { return [k, 0]; } })
    .sort((a, b) => b[1] - a[1]);
  for (const [k] of mine.slice(CACHE_KEEP * 2 - 1)) store.del(k);
  if (!store.set(ck, JSON.stringify(obj))) { for (const [k] of mine) store.del(k); store.set(ck, JSON.stringify(obj)); }
}

// ---------- run ----------
let current = null;
$("form").onsubmit = e => { e.preventDefault(); run($("sym").value); };

async function run(raw) {
  const sym = raw.trim().toUpperCase().replace(/\s+/g, "");
  if (!/^[A-Z][A-Z0-9.\-]{0,9}$/.test(sym)) return status("請輸入美股代號，例如 AAPL、TSLA、QQQ。", "err");
  if (!store.get(KEY_STORE)) { $("keybox").open = true; return status("第一次用要先設定 Twelve Data API key（下面）。", "err"); }
  $("sym").value = sym; $("go").disabled = true;
  status('<span class="spin"></span>攞緊 ' + esc(sym) + " 嘅數據…");
  try {
    const daily = await fetchSeries(sym, "1day");
    if (daily.bars.length < 260) throw new Error("呢隻股上市唔夠一年（得 " + daily.bars.length + " 日數據），好多指標計唔到。");
    let intra = null, intraErr = "";
    try { intra = await fetchSeries(sym, "5min"); }
    catch (e) { intraErr = e.message; }
    status('<span class="spin"></span>計算緊…');
    await new Promise(r => setTimeout(r, 20));
    const res = A.analyze(daily.bars, intra ? intra.bars : null);
    current = { sym, meta: daily.meta, daily: daily.bars, res, intraErr, range: 252, sel: null,
                intra: intra && intra.bars.length ? intra.bars : null, iv: intra && intra.bars.length ? intraSeries(intra.bars) : null };
    render();
    status(intraErr ? "⚠️ 5 分鐘數據攞唔到（" + esc(intraErr) + "），VWAP 部分會留空，其他照計。" : "");
    try { history.replaceState(null, "", "#" + sym); } catch (e) { /* file:// */ }
  } catch (e) {
    status(esc(e.message || String(e)), "err");
  } finally { $("go").disabled = false; }
}

const RANGES = [["i1", "即日"], ["i5", "5 日"], [21, "1 個月"], [63, "3 個月"], [126, "6 個月"], [252, "1 年"], [756, "3 年"]];

function intraSeries(b) {
  const vw = [], c = [], starts = [];
  let day = "", pv = 0, vol = 0;
  b.forEach((x, i) => {
    const d = x.t.slice(0, 10);
    if (d !== day) { day = d; pv = 0; vol = 0; starts.push(i); }
    pv += (x.h + x.l + x.c) / 3 * x.v; vol += x.v;
    vw.push(vol ? pv / vol : NaN); c.push(x.c);
  });
  return { vw, c, starts };
}

// sync range tabs, selected-pattern note and card highlight with current state
function chartUI() {
  for (const b of document.querySelectorAll("#ranges button")) b.setAttribute("aria-pressed", String(current.range) === b.dataset.n);
  const p = current.sel !== null ? current.res.patterns[current.sel] : null, note = $("selnote");
  note.hidden = !p;
  if (p) {
    note.innerHTML = "<span>顯示緊：<b>" + A.PATTERN_NAMES[p.key] + "</b>（淺色底 = 形態範圍" +
      (typeof current.range === "string" ? "；形態只喺日線圖顯示，撳返 3 個月或以上" : "") + '）</span><button type="button" id="selclear">✕ 取消</button>';
    $("selclear").onclick = () => selectPattern(current.sel);
  }
  for (const el of document.querySelectorAll(".pcard")) el.setAttribute("aria-pressed", +el.dataset.p === current.sel);
}

function selectPattern(k) {
  if (current.sel === k) { current.sel = null; chartUI(); drawChart(); return; }
  current.sel = k;
  const p = current.res.patterns[k], n = current.daily.length, i1 = Math.min(...p.lines.map(l => l.i1));
  const need = Math.ceil((n - i1) * 1.25) + 5;   // pattern plus some lead-in
  const fit = RANGES.find(([r]) => typeof r === "number" && r >= need);   // smallest range that shows the whole pattern
  current.range = fit ? fit[0] : Math.min(n, need);
  chartUI(); drawChart();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!$("chartpanel").classList.contains("full")) $("chartpanel").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
}

function toggleFull() {
  const full = $("chartpanel").classList.toggle("full");
  document.body.classList.toggle("noscroll", full);
  $("fullbtn").textContent = full ? "✕ 收細" : "⛶ 全螢幕";
  drawChart();
}
addEventListener("keydown", ev => { if (ev.key === "Escape" && $("chartpanel") && $("chartpanel").classList.contains("full")) toggleFull(); });
let resizeQueued = false;
addEventListener("resize", () => {
  if (resizeQueued || !current || !$("chart")) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; drawChart(); });
});

function tile(k, v, s) { return '<div class="tile"><span class="k">' + k + '</span><span class="v">' + v + '</span><span class="s">' + s + "</span></div>"; }

function holdingNote(h, c, I, e) {
  const pl = c / h.cost - 1, stop = h.cost * 0.92, half = h.cost * 1.5;
  const parts = ["持有 " + h.qty + " 股，成本 " + f2(h.cost) + "，而家 " + pct(pl) + "（約 " +
    (pl >= 0 ? "+" : "−") + "$" + f2(Math.abs((c - h.cost) * h.qty)) + "）。"];
  parts.push("按規則 B：成本計止蝕位 " + f2(stop) + "（−8%）" + (c <= stop ? " ⚠️ 已經跌穿" : "，距離 " + pct(stop / c - 1)) +
    "；+50% 賣一半位 " + f2(half) + (c >= half ? " ✅ 已到" : "，距離 " + pct(half / c - 1)) + "。");
  parts.push(c > I.ma200[e] ? "仍然喺 200 天線之上，規則 B 下繼續持有。" : "已經跌穿 200 天線，規則 B 下應該考慮賣出。");
  return '<span class="note" style="font-size:14px">' + esc(parts.join("")) + "</span>";
}

const DIR_TXT = { "1": "偏好（向上）", "-1": "偏淡（向下）", "0": "方向未定" };

function patternSketch(key) {
  const [price, lines] = PATTERN_GUIDE[key].sketch;
  return '<svg class="psk" viewBox="-4 -4 128 68" aria-hidden="true">' +
    lines.split("|").map(l => '<polyline class="g" points="' + l + '"/>').join("") +
    '<polyline points="' + price + '"/></svg>';
}

function patternGuideBody(key) {
  const g = PATTERN_GUIDE[key];
  return '<dl class="pg">' + [["樣子", g.look], ["代表乜", g.mean], ["點樣確認", g.confirm], ["量度目標", g.target], ["止蝕放邊", g.stop], ["要小心", g.watch]]
    .map(([k, v]) => "<dt>" + k + "</dt><dd>" + esc(v) + "</dd>").join("") + "</dl>";
}

// glossary of every pattern; ones found in this stock right now are marked
function patternGlossary(R) {
  const found = new Set(R.patterns.map(p => p.key));
  return '<div id="pguide" class="pguide" hidden><p class="note" style="margin:0 0 12px">以下係呢個工具識搵嘅全部 ' + Object.keys(PATTERN_GUIDE).length +

      return '<div class="card" style="--c:var(--' + cc + ')"><div class="row"><b>' + A.PATTERN_NAMES[key] + '</b><span class="chip ' + cc + '">' + DIR_TXT[g.dir] + "</span>" +

function patternCard(p, R, c, k) {
  const name = A.PATTERN_NAMES[p.key], h = R.patternHistory.stats[p.key + (p.dir || 1)];
  const dirTxt = p.dir > 0 ? "偏好（向上）" : p.dir < 0 ? "偏淡（向下）" : "方向未定";
  const col = p.status === "breakout" ? (p.dir > 0 ? "var(--gain)" : "var(--loss)") : "var(--warn)";
  let body = p.status === "breakout"
    ? "已經" + (p.dir > 0 ? "向上突破 " : "向下跌穿 ") + f2(p.level) + "。量度目標 " + f2(p.target) + "（" + pct(p.target / c - 1) + "）" +
      (ok(p.stop) ? "，失敗位 " + f2(p.stop) : "") + "。"
    : (p.key.endsWith("tri") || p.key.endsWith("wedge")
        ? "仲未突破：上邊 " + f2(p.upper) + "、下邊 " + f2(p.lower) + "。"
        : "仲未確認：要" + (p.dir > 0 ? "升穿 " : "跌穿 ") + f2(p.level) + " 先算。") +
      "如果確認，量度目標約 " + f2(p.target) + "。";
  const hist = h && h.n ? "呢隻股過去 " + h.n + " 次" + (h.dir > 0 ? "向上突破" : "向下跌穿") + "後 " + A.FWD + " 日，" + h.wins + " 次行啱方向（" +
    pct(h.wins / h.n, 0, false) + "）。" : "呢隻股過去未試過出現呢個形態嘅突破，冇歷史參考。";
  return '<div class="card pcard" role="button" tabindex="0" aria-pressed="false" data-p="' + k + '" style="--c:' + col + '"><div class="row"><b>' + name + '</b><span class="chip ' +
    (p.status === "breakout" ? (p.dir > 0 ? "gain" : "loss") : "warn") + '">' + (p.status === "breakout" ? "已突破" : "形成中") +
    '</span><span class="chip plain">' + dirTxt + "</span></div><div>" + esc(body) + '</div><div class="note">' + esc(PATTERN_GUIDE[p.key].short) +
    "</div><div class=\"note\">" + esc(hist) + '</div><details class="pexp"><summary>📖 詳細解釋：點睇、點確認、目標同止蝕</summary>' +
    patternSketch(p.key) + patternGuideBody(p.key) + '</details><span class="hint">📈 撳呢張卡，喺走勢圖睇呢個形態</span></div>';
}

      '</td><td class="r num">' + s.n + '</td><td class="r num">' + pct(s.wins / s.n, 0, false) + '</td><td class="r num ' + cls(s.sum) + '">' +

function vwapSection(R) {
  const head = '<section><div class="sec-head"><h2>VWAP 即日回歸（機械人用緊）</h2><span class="note">用最近約 2–3 個月 5 分鐘數據</span></div>';
  const V = R.vwap;
  if (!V || !V.today) return head + '<div class="empty">冇 5 分鐘數據，計唔到。' + esc(current.intraErr || "") + "</div></section>";
  const T = V.today, gap = T.last / T.trigger - 1;
  let now;
  if (!T.uptrend) now = "今日唔符合條件：前一日收市低過 50 天線（策略只喺上升趨勢做）。";
  else if (T.last < T.trigger) now = "而家股價 " + f2(T.last) + " 已經低過觸發位 " + f2(T.trigger) + "，符合買入條件（10:00–15:00 先做）。";
  else now = "今日觸發位 " + f2(T.trigger) + "（VWAP " + f2(T.vwap) + " − 0.5 ATR），而家 " + f2(T.last) + "，要再跌 " + pct(-gap, 1, false) + " 先觸發。";
  return head + '<div class="tiles">' +
    tile("測試日數", V.days + " 日", "有觸發 " + V.n + " 次") +
    tile("勝率", pct(V.winRate, 0, false), V.n < 10 ? "次數太少，參考價值低" : "賺錢交易比例") +
    tile("平均每次", '<span class="' + cls(V.avg) + '">' + pct(V.avg, 2) + "</span>", "已扣成本") +
    tile("累計", '<span class="' + cls(V.total) + '">' + pct(V.total, 1) + "</span>", "全倉每次計") +
    '</div><div class="note"><p>規則：前一日收市高過 50 天線；10:00–15:00 之間股價跌穿「VWAP − 0.5×ATR」就買；目標返到 VWAP，止蝕 0.5 ATR，15:55 一定平倉。</p><p>' +
    esc(T.day + "：" + now) + "</p></div></section>";
}

function exitTable(R, c, a, hold) {
  const e = current.daily.length - 1;
  const quick = [["現價", c]];
  for (const x of R.levels.support.slice(0, 2)) quick.push(["支持位", x.price]);
  if (R.levels.resistance[0]) quick.push(["突破阻力", R.levels.resistance[0].price]);
  if (hold) quick.push(["你嘅成本", hold.cost]);
  return '<section><div class="sec-head"><h2>止蝕同止盈位</h2><span class="note">ATR = ' + f2(a) + "（每日平均波幅）</span></div>" +
    '<div class="panel"><div class="row"><label for="entry"><b>計劃買入價</b></label>' +
    '<input type="text" inputmode="decimal" id="entry" aria-label="計劃買入價" style="width:120px;font-family:var(--font-num)" value="' + (hold ? hold.cost : c).toFixed(2) + '">' +
    quick.map(([t, v]) => '<button type="button" class="pick" data-v="' + v + '">' + t + " " + f2(v) + "</button>").join("") +
    '</div><div class="note" id="entrynote"></div></div><div id="exitbody"></div></section>';
}

// recompute stop / take-profit for the typed entry price; only the exit block is redrawn so the input keeps focus
function updateExits() {
  const R = current.res, I = R.I, e = current.daily.length - 1, c = I.c[e], hold = HOLD[current.sym];
  const v = parseFloat(($("entry").value || "").replace(/[$,\s]/g, ""));
  const p = v > 0 ? v : c, diff = p / c - 1;
  const exits = A.exitLevels(I, R.levels, e, p);
  let how;
  if (!(v > 0)) how = "⚠️ 價錢唔啱，暫時用現價 " + f2(c) + " 計。";
  else if (Math.abs(diff) < 0.002) how = "差唔多現價，可以用市價單（market order）直接買。";
  else if (diff < 0) how = "要再跌 " + pct(-diff, 1, false) + " 先買到 → 落「限價買單」（limit buy order）喺 " + f2(p) +
    "：股價跌到先成交，跌唔到就唔會買，唔使成日睇住。";
  else how = "要再升 " + pct(diff, 1, false) + " 先買 → 用「觸發買單」（stop buy order）喺 " + f2(p) +
    "：等升穿（突破）先追入。⚠️ 唔好落限價單，因為限價高過現價會即刻用現價成交。";
  if (v > 0 && Math.abs(diff) > 0.25) how += " 呢個價離現價好遠，下面嘅止蝕止盈到時要再計過。";
  $("entrynote").innerHTML = esc(how);
  const rows = exits.map(x => '<tr><td><b>' + esc(x.name) + '</b></td><td class="r num loss">' + f2(x.stop) +
    '<br><span class="note">' + pct(x.riskPct) + '</span></td><td class="r num gain">' + f2(x.tp1) +
    '<br><span class="note">' + pct(x.tp1 / p - 1) + '</span></td><td class="r num">' + (x.tp2Note ? '<span class="note">' + esc(x.tp2Note) + "</span><br>" + f2(x.tp2) :
      f2(x.tp2) + '<br><span class="note">' + pct(x.tp2 / p - 1) + "</span>") +
    '</td><td class="r num">' + (ok(x.rr) ? "1 : " + x.rr.toFixed(1) : "—") + '</td><td class="wrap-cell">' + esc(x.how) +
    (x.note ? "<br>⚠️ " + esc(x.note) : "") + "</td></tr>").join("");
  $("exitbody").innerHTML = '<p class="note">以買入價 <b class="num">' + f2(p) + "</b> 計（% 係對比買入價）</p>" +
    '<div class="table-wrap"><table><thead><tr><th>方法</th><th class="r">止蝕</th><th class="r">止盈 1</th><th class="r">止盈 2</th>' +
    '<th class="r">風險回報比</th><th>計法</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<div class="note"><p>風險回報比 = 去到止盈 1 賺幾多 ÷ 去到止蝕蝕幾多。1 : 2 即係冒 $1 風險博 $2，一般最少要 1 : 1.5 先抵做。' +
    "喺支持位附近買，止蝕近、風險細，風險回報比通常好啲。</p>" +
    "<p>長線用闊啲嘅止蝕（2 ATR 或者 −8%），唔會俾日常波動震走；短線用窄啲（1 ATR）。止蝕位放喺支持位下面，係因為跌穿支持代表判斷錯咗。" +
    (hold ? "你持倉嘅成本價止蝕位喺上面「你手上嘅」卡度。" : "") + "</p></div>";
}

    "</tbody></table></div></section>";
}

// ---------- chart ----------
function drawChart() {
  const el = $("chart");
  if (!el) return;
  const R = current.res, I = R.I, full = $("chartpanel").classList.contains("full"), intra = typeof current.range === "string";
  const W = Math.max(300, Math.round(el.clientWidth));
  const H = full ? Math.max(240, Math.round(el.clientHeight)) : W < 640 ? Math.round(W * 0.9) : Math.round(Math.min(600, Math.max(380, W * 0.5)));
  const padL = 8, padR = 64, padT = 12, padB = 26;
  let b, s, series, tipFn;
  if (intra) {
    const IV = current.iv;
    b = current.intra; s = IV.starts[Math.max(0, IV.starts.length - (current.range === "i1" ? 1 : 5))];
    series = [["vw", IV.vw], ["px", IV.c]];
    tipFn = i => esc(b[i].t.slice(5, 16)) + "<br>價 " + f2(b[i].c) + "<br>VWAP " + f2(IV.vw[i]);
    $("legend").innerHTML = '<span style="--c:var(--ink)">5 分鐘價</span><span style="--c:var(--accent)">VWAP（成交量加權平均價，每日重新計）</span>';
  } else {
    b = current.daily; s = Math.max(0, b.length - current.range);
    series = [["m200", I.ma200], ["m50", I.ma50], ["px", I.c]];
    tipFn = i => esc(b[i].t.slice(0, 10)) + "<br>收市 " + f2(b[i].c) + "<br>50 天線 " + f2(I.ma50[i]) + " · 200 天線 " + f2(I.ma200[i]);
    $("legend").innerHTML = '<span style="--c:var(--ink)">收市價</span><span style="--c:var(--ma50)">50 天線</span><span style="--c:var(--ma200)">200 天線</span>' +
      '<span class="dash" style="--c:var(--gain)">支持位</span><span class="dash" style="--c:var(--loss)">阻力位</span>' +
      (R.patterns.length ? '<span style="--c:var(--accent)">形態線</span>' : "");
  }
  const n = b.length, px = series[series.length - 1][1];
  const sel = !intra && current.sel !== null ? R.patterns[current.sel] : null;
  // horizontal marks for the selected pattern: breakout level, target, failure level
  const marks = sel ? [[sel.level, "突破位", "var(--accent)"],
    [sel.target, "目標", sel.dir < 0 ? "var(--loss)" : "var(--gain)"],
    [sel.stop, "失敗位", sel.dir < 0 ? "var(--gain)" : "var(--loss)"]].filter(m => ok(m[0])) : [];
  let lo = Infinity, hi = -Infinity;
  for (let i = s; i < n; i++) for (const [, arr] of series) if (ok(arr[i])) { lo = Math.min(lo, arr[i]); hi = Math.max(hi, arr[i]); }
  const lv = intra || sel ? [] : [...R.levels.support, ...R.levels.resistance].filter(x => x.price > lo * 0.9 && x.price < hi * 1.1);
  for (const v of [...lv.map(x => x.price), ...marks.map(m => m[0])]) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  const padY = (hi - lo) * 0.05 || hi * 0.01; lo -= padY; hi += padY;
  const X = i => padL + (i - s) / Math.max(1, n - 1 - s) * (W - padL - padR);
  const Y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const path = (arr, brk) => { let p = "", pen = false; for (let i = s; i < n; i++) { if (!ok(arr[i])) { pen = false; continue; } if (brk && brk.has(i)) pen = false; p += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(arr[i]).toFixed(1); pen = true; } return p; };
  const xText = (i, t) => { if (X(i) > padL + 14 && X(i) < W - padR - 20) g.push('<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + t + "</text>"); };
  const md = t => +t.slice(5, 7) + "/" + +t.slice(8, 10);
  const g = [];
  // grid + y labels
  const step = niceStep((hi - lo) / Math.max(4, Math.round(H / 80)));
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    g.push('<line class="grid" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>' +
      '<text x="' + (W - padR + 6) + '" y="' + (Y(v) + 4) + '">' + f2(v, step < 1 ? 2 : 0) + "</text>");
  }
  // x labels
  if (intra) {
    const starts = new Set(current.iv.starts);
    for (let i = s; i < n; i++) {
      if (current.range === "i5") {
        if (starts.has(i)) {
          if (i > s) g.push('<line class="grid" x1="' + X(i) + '" x2="' + X(i) + '" y1="' + padT + '" y2="' + (H - padB) + '"/>');
          xText(i + 3, md(b[i].t));
        }
      } else if (b[i].t.slice(14, 16) === "00") xText(i, b[i].t.slice(11, 16));
    }
  } else if (n - s <= 70) {
    const every = n - s <= 25 ? 5 : 10;
    for (let i = n - 1; i >= s; i -= every) xText(i, md(b[i].t));
  } else {
    let lastM = "";
    const every = n - s > 300 ? 6 : n - s > 150 ? 2 : 1;
    for (let i = s; i < n; i++) {
      const m = b[i].t.slice(0, 7);
      if (m !== lastM) {
        if (lastM && (+m.slice(5) - 1) % every === 0) xText(i, m.slice(5) === "01" ? m.slice(0, 4) : +m.slice(5) + "月");
        lastM = m;
      }
    }
  }
  g.push('<clipPath id="clip"><rect x="' + padL + '" y="' + padT + '" width="' + (W - padL - padR) + '" height="' + (H - padT - padB) + '"/></clipPath><g clip-path="url(#clip)">');
  if (sel) {
    const i1 = Math.max(s, Math.min(...sel.lines.map(l => l.i1)));
    g.push('<rect class="zone" x="' + X(i1) + '" y="' + padT + '" width="' + (X(n - 1) - X(i1)) + '" height="' + (H - padT - padB) + '"/>');
  }
  for (const x of lv) g.push('<line class="' + (R.levels.support.includes(x) ? "sup" : "res") + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(x.price) + '" y2="' + Y(x.price) + '"/>');
  const dayBreaks = intra ? new Set(current.iv.starts) : null;   // VWAP restarts each day
  for (const [k, arr] of series) g.push('<path class="' + k + '" d="' + path(arr, k === "vw" ? dayBreaks : null) + '"/>');
  if (!intra) for (const p of sel ? [sel] : R.patterns) for (const ln of p.lines)
    if (ln.i2 >= s) g.push('<line class="pat' + (sel ? " sel" : "") + '" x1="' + X(ln.i1) + '" y1="' + Y(ln.p1) + '" x2="' + X(ln.i2) + '" y2="' + Y(ln.p2) + '"/>');
  for (const [v, t, col] of marks)
    g.push('<line class="hl" style="stroke:' + col + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>' +
      '<text class="lab" style="fill:' + col + '" x="' + (padL + 6) + '" y="' + (Y(v) - 5) + '">' + t + " " + f2(v) + "</text>");
  g.push("</g>");
  g.push('<line class="cross" id="cx" y1="' + padT + '" y2="' + (H - padB) + '" visibility="hidden"/><circle class="dot" id="cd" r="4" visibility="hidden"/>');
  el.innerHTML = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(current.sym) + ' 股價走勢圖">' + g.join("") +
    '<rect id="hit" x="' + padL + '" y="0" width="' + (W - padL - padR) + '" height="' + H + '" fill="transparent"/></svg><div class="tip" hidden></div>';
  const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cx = $("cx"), cd = $("cd");
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W;
    const i = Math.min(n - 1, Math.max(s, Math.round(s + (x - padL) / (W - padL - padR) * (n - 1 - s))));
    cx.setAttribute("x1", X(i)); cx.setAttribute("x2", X(i)); cx.setAttribute("visibility", "visible");
    cd.setAttribute("cx", X(i)); cd.setAttribute("cy", Y(px[i])); cd.setAttribute("visibility", "visible");
    tip.hidden = false;
    tip.innerHTML = tipFn(i);
    tip.style.left = Math.min(r.width - 90, Math.max(90, X(i) / W * r.width)) + "px";
    tip.style.top = Y(px[i]) / H * r.height + "px";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cx.setAttribute("visibility", "hidden"); cd.setAttribute("visibility", "hidden"); });
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
}

// ---------- start ----------
refreshKeyUI();
const picks = Object.keys(HOLD);
$("picks").innerHTML = (picks.length ? '<span class="note">你持有：</span>' : "") +
  picks.map(s => '<button type="button" class="pick" data-s="' + esc(s) + '">' + esc(s) + "</button>").join("");
for (const b of document.querySelectorAll("#picks .pick")) b.onclick = () => run(b.dataset.s);
const fromHash = decodeURIComponent(location.hash.slice(1));
if (fromHash && store.get(KEY_STORE)) run(fromHash);
</script>
