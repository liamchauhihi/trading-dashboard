<style>
/* Layout: a long-term holdings watch. Summary strip + holdings table, buy/sell points per holding,
   briefings, important news, key dates. One column on phones, multi-column cards on desktop. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #152030;
  --muted: #5A6577;
  --faint: #8C96A6;
  --line: #DCE1E8;
  --accent: #2F4FA8;
  --accent-soft: #E5EAF7;
  --gain: #18794E;
  --gain-soft: #E2F2EA;
  --loss: #C2362B;
  --loss-soft: #F8E4E1;
  --warn: #9A6200;
  --warn-soft: #F7EDD9;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D131B; --surface: #141C27; --ink: #E4EAF2; --muted: #9AA6B8; --faint: #6D798B; --line: #243041;
  --accent: #6E87E0; --accent-soft: #1C2742; --gain: #2A9D63; --gain-soft: #12291F; --loss: #E0533F; --loss-soft: #301916;
  --warn: #D9A03A; --warn-soft: #2C2312; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D131B; --surface: #141C27; --ink: #E4EAF2; --muted: #9AA6B8; --faint: #6D798B; --line: #243041;
  --accent: #6E87E0; --accent-soft: #1C2742; --gain: #2A9D63; --gain-soft: #12291F; --loss: #E0533F; --loss-soft: #301916;
  --warn: #D9A03A; --warn-soft: #2C2312; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); } .loss { color: var(--loss); }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px;
  border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
header.top h1 { font-family: var(--font-display); font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; white-space: nowrap; }
.chip.gain { background: var(--gain-soft); color: var(--gain); }
.chip.loss { background: var(--loss-soft); color: var(--loss); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }

nav.jump { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
nav.jump a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
nav.jump a:hover { color: var(--ink); border-color: var(--ink); }

section { display: grid; gap: 14px; scroll-margin-top: 16px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-size: 22px; margin: 0; text-wrap: balance; }
.label { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tile { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.tile .v { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }

.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px;
  border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; letter-spacing: .04em; color: var(--muted); font-weight: 500; background: var(--bg); position: sticky; top: 0; }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--accent-soft); }
td.reason { white-space: normal; min-width: 180px; color: var(--muted); font-size: 13px; }
.sym { font-weight: 700; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.brief { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; max-width: 72ch; }
.brief p { margin: 0 0 .7em; }
.brief .meta { color: var(--faint); font-size: 12px; margin-bottom: 10px; }


footer { color: var(--faint); font-size: 12px; border-top: 1px solid var(--line); padding-top: 12px; }
@media (prefers-reduced-motion: no-preference) { .tile, .panel { transition: border-color .2s; } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.card h3 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card h3 .px { font-family: var(--font-num); font-weight: 600; margin-left: auto; }
.card dl { display: grid; grid-template-columns: 1fr auto auto; gap: 3px 10px; margin: 0; font-size: 13px; }
.card dt { color: var(--muted); } .card dd { margin: 0; text-align: right; font-family: var(--font-num); }
.card .grp { font-size: 12px; color: var(--faint); letter-spacing: .05em; grid-column: 1 / -1; margin-top: 4px; }
.best { background: var(--gain-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.best.none { background: var(--bg); color: var(--muted); }
.list { display: grid; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; display: grid; gap: 4px; }
.item .meta { color: var(--faint); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item .t { font-weight: 700; }
.item .s { color: var(--muted); font-size: 14px; }
</style>

const $ = (id) => document.getElementById(id);
const fmtMoney = (v, sign) => (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtPx = (v) => v == null ? "—" : v >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 0 }) : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(1) + "%";
const cls = (v) => (v > 0 ? "gain" : v < 0 ? "loss" : "");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : "";

function tile(label, value, sub, klass) {
  return `<div class="tile"><span class="label">${label}</span><span class="v ${klass || ""}">${value}</span><span class="s">${sub || "&nbsp;"}</span></div>`;
}

function renderReal(d) {
  const r = d.real, pnl = r.total - r.cost;
  const down = r.rows.filter((x) => x.vs200 < 0).length;
  const nearStop = r.rows.filter((x) => x.last <= x.stop * 1.02).length;
  const top = r.rows[0];
  $("real-tiles").innerHTML = [
    tile("總市值", fmtMoney(r.total), `${r.rows.length} 隻股票／ETF`),
    tile("未實現盈虧", fmtMoney(pnl, true), fmtPct(pnl / r.cost), cls(pnl)),
    tile("低於 200 天線", `${down} 隻`, "長線趨勢轉弱", down ? "loss" : ""),
    tile("接近／跌穿參考止蝕", `${nearStop} 隻`, "現價 ≤ 止蝕位 +2%", nearStop ? "loss" : ""),
    tile("最大持倉", top ? esc(top.sym) : "—", top ? `佔 ${(top.weight * 100).toFixed(0)}%` : "", top && top.weight > 0.3 ? "loss" : ""),
  ].join("");
  $("real-rows").innerHTML = r.rows.map((x) => {
    const trend = x.vs200 >= 0.03 ? `<span class="chip gain">▲ 上升</span>` : x.vs200 >= 0 ? `<span class="chip warn">● 貼近</span>` : `<span class="chip loss">▼ 下跌</span>`;
    const stopCls = x.last <= x.stop * 1.02 ? "loss" : "";
    return `<tr><td class="sym"><a href="analyzer.html#${encodeURIComponent(x.sym)}">${esc(x.sym)}</a></td><td class="r num">${x.qty}</td><td class="r num">${fmtPx(x.cost)}</td>
      <td class="r num">${fmtPx(x.last)}</td><td class="r num ${cls(x.day)}">${fmtPct(x.day)}</td>
      <td class="r num">${fmtMoney(x.value)}</td><td class="r num">${(x.weight * 100).toFixed(0)}%</td>
      <td class="r num ${cls(x.pnl)}">${fmtMoney(x.pnl, true)} <span class="note">${fmtPct(x.pct)}</span></td>
      <td class="r num">${fmtPx(x.ma200)} <span class="note">${fmtPct(x.vs200)}</span></td><td>${trend}</td>
      <td class="r num ${stopCls}">${fmtPx(x.stop)}${x.last <= x.stop ? " ⚠" : ""}</td><td class="num">${x.earnings || "—"}</td></tr>`;
  }).join("");
}

function renderLevels(d) {
  const syms = d.real.rows.map((x) => x.sym).filter((s) => d.levels[s]);
  $("level-cards").innerHTML = syms.map((s) => {
    const r = d.levels[s], e = r.exit, px = r.close;
    const row = (name, v) => v == null ? "" : `<dt>${name}</dt><dd>${fmtPx(v)}</dd><dd class="${cls(v / px - 1)}">${fmtPct(v / px - 1)}</dd>`;
    const best = r.entries.find((x) => x.best);
    const bestHtml = best
      ? `<div class="best">⭐ 加倉位：<b>${esc(best.order)} ${fmtPx(best.price)}</b>（${esc(best.name)}）<br>止蝕 ${fmtPx(best.stop)} · 目標 ${fmtPx(best.tp)} · 回報風險比 ${best.rr.toFixed(1)} · 10 日內到價機率 ${(best.reach * 100).toFixed(0)}%</div>`
      : `<div class="best none">暫時冇理想加倉位（風險回報唔夠好，或者喺下跌趨勢）</div>`;
    return `<div class="card"><h3><a href="analyzer.html#${encodeURIComponent(s)}">${esc(s)}</a><span class="chip ${r.trend === "上升" ? "gain" : r.trend === "下跌" ? "loss" : "warn"}">${esc(r.trend)}</span>
      <span class="px">${fmtPx(px)}</span></h3>
      <div class="note">收市 ${esc(r.asof)} · 成本 ${fmtPx(r.cost)}（<span class="${cls(r.pnl_pct)}">${fmtPct(r.pnl_pct)}</span>）</div>
      <dl><div class="grp">賣出／止蝕</div>${row("參考止蝕（成本 −8%）", e.rule_b_stop)}${row("技術止蝕", e.tech_stop)}${row("200 天線（趨勢）", e.trend_exit)}${row("止賺一半（成本 +50%）", e.half_take_profit)}
        <div class="grp">支持 / 阻力</div>${r.resistance.slice(0, 2).map((x, i) => row(`阻力 ${i + 1}`, x.price)).join("")}${r.support.slice(0, 2).map((x, i) => row(`支持 ${i + 1}`, x.price)).join("")}</dl>
      ${bestHtml}</div>`;
  }).join("") || `<div class="empty">未有數據。</div>`;
}

function mdLite(text) {
  return esc(text)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^#{1,4} (.+)$/gm, "<b>$1</b>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .split(/\n{2,}/).map((p) => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
}

function renderBriefs(d) {
  const names = { brief: "🌅 開市前簡報", weekly: "📝 每週檢討", alert: "🚨 最近警報" };
  const keys = Object.keys(names).filter((k) => d.briefings[k]);
  if (!keys.length) return;
  const show = (k) => {
    $("brief-tabs").querySelectorAll("button").forEach((b) => b.setAttribute("aria-selected", b.dataset.k === k));
    $("brief-body").innerHTML = `<div class="meta">${d.briefings[k].time}（香港時間）</div>${mdLite(d.briefings[k].text)}`;
  };
  $("brief-tabs").innerHTML = keys.map((k) => `<button role="tab" data-k="${k}">${names[k]}</button>`).join("");
  $("brief-tabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => show(b.dataset.k)));
  show(keys[0]);
}

function renderNews(d) {
  const n = d.news;
  if (n.summary) { $("news-summary").hidden = false; $("news-summary").innerHTML = `<div class="meta">${esc(n.at)}</div>${mdLite(n.summary)}`; }
  const arrow = { up: "▲", down: "▼", mixed: "◆" };
  $("news-list").innerHTML = n.items.map((i) => `<div class="item">
    <div class="meta"><span>${esc(i.time)}</span><span>${esc(i.source || "")}</span>${(i.affects || []).map((a) =>
      `<span class="chip ${a.dir === "up" ? "gain" : a.dir === "down" ? "loss" : "warn"}">${arrow[a.dir] || ""} ${esc(a.sym)}</span>`).join("")}</div>
    <div class="t">${safeUrl(i.url) ? `<a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.headline)}</a>` : esc(i.headline)}</div>
    <div class="s">${esc(i.summary || "")}</div></div>`).join("") || `<div class="empty">暫時冇重要新聞。</div>`;
}

function renderEvents(d) {
  const wd = "日一二三四五六";
  $("event-list").innerHTML = d.events.map((e) => {
    const dt = new Date(e.date + "T12:00:00");
    return `<div class="item"><div class="meta"><span class="num">${esc(e.date)}（${wd[dt.getDay()]}）</span>${e.time ? `<span>${esc(e.time)}</span>` : ""}
      ${(e.affects || []).map((a) => `<span class="chip">${esc(a)}</span>`).join("")}</div>
      <div class="t">${esc(e.name || e.type)}</div>${e.why ? `<div class="s">${esc(e.why)}</div>` : ""}</div>`;
  }).join("") || `<div class="empty">未來兩星期冇特別重要嘅日子。</div>`;
}

if (DATA) {
  $("updated").textContent = `更新時間：${DATA.updated}（香港時間）`;
  renderReal(DATA); renderLevels(DATA); renderBriefs(DATA); renderNews(DATA); renderEvents(DATA);
}
</script>

</body>
</html>
